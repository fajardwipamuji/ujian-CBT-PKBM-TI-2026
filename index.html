<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureTest - Ujian CBT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; -ms-user-select: none; }
    #wacana-container { overflow-y: auto; max-height: 80vh; }
  </style>
</head>
<body class="bg-gray-100 font-sans p-4">

  <!-- ================= HALAMAN LOGIN ================= -->
  <div id="login-page" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-4 text-center">Login Ujian</h2>
    
    <label class="block mb-2 text-sm font-medium">Pilih Kelas</label>
    <select id="kelas" class="w-full border p-2 mb-4 rounded" onchange="updateNama()">
      <option value="">-- Loading Data... --</option>
    </select>

    <label class="block mb-2 text-sm font-medium">Pilih Nama</label>
    <select id="nama" class="w-full border p-2 mb-6 rounded" disabled>
      <option value="">-- Pilih Kelas Dahulu --</option>
    </select>

    <button id="btn-mulai" class="w-full bg-blue-600 text-white p-2 rounded disabled:bg-gray-400 font-bold" onclick="mulaiUjian()" disabled>MULAI UJIAN</button>
  </div>


  <!-- ================= HALAMAN UJIAN ================= -->
  <div id="exam-page" class="hidden max-w-6xl mx-auto flex flex-col md:flex-row gap-4 mt-4">
    <div class="md:w-1/2 bg-white p-6 rounded-lg shadow-md" id="wacana-container">
      <h3 class="font-bold text-lg mb-4 text-gray-700 border-b pb-2">Teks Referensi</h3>
      <div id="wacana-teks" class="text-gray-700 leading-relaxed text-sm md:text-base text-justify">Loading...</div>
    </div>

    <div class="md:w-1/2 bg-white p-6 rounded-lg shadow-md relative">
      <div class="flex justify-between mb-4 border-b pb-2">
        <span class="font-bold text-blue-700" id="nama-siswa-display"></span>
      </div>
      
      <div id="soal-container" class="mb-8"></div>
      
      <div class="flex justify-between mt-auto">
        <button class="bg-gray-300 hover:bg-gray-400 p-2 rounded w-24 font-bold text-sm" onclick="navigasi(-1)">KEMBALI</button>
        <button id="btn-selanjutnya" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded w-32 font-bold text-sm" onclick="navigasi(1)">SELANJUTNYA</button>
      </div>
    </div>
  </div>


  <!-- ================= JAVASCRIPT LOGIKA ================= -->
  <script>
    // ⚠️ MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbyDgfCZtTVn-XJTUcBQ6iuFFR7v6-EgQ8k5qT7GYMAfOB365d1PUgkfBer9kE-BodfT_Q/exec"; 

    let dbSiswa, dbWacana, dbSoal;
    let indexSoal = 0;
    let jawabanSiswa = {}; 
    let warningCount = 0;

    // --- ANTI CHEAT ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => { e.preventDefault(); alert('Tindakan menyalin dilarang!'); });
    
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && !document.getElementById('exam-page').classList.contains('hidden')) {
        warningCount++;
        alert(`PERINGATAN! Anda terdeteksi meninggalkan halaman ujian. (Peringatan ${warningCount}/3)`);
        if (warningCount >= 3) { 
          alert("Ujian dihentikan paksa karena pelanggaran berulang!"); 
          prosesSelesai(); 
        }
      }
    });

    // --- AMBIL DATA ---
    async function loadData() {
      try {
        const response = await fetch(API_URL + "?action=getData");
        const data = await response.json();
        dbSiswa = data.siswa;
        dbWacana = data.wacana;
        dbSoal = data.soal;

        const selectKelas = document.getElementById('kelas');
        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        Object.keys(dbSiswa).forEach(k => selectKelas.add(new Option(k, k)));
      } catch (error) {
        alert("Gagal memuat data. Pastikan URL API benar dan internet stabil.");
      }
    }
    
    loadData();

    function updateNama() {
      const kelas = document.getElementById('kelas').value;
      const selectNama = document.getElementById('nama');
      selectNama.innerHTML = '<option value="">-- Pilih Nama --</option>';
      if (kelas) {
        selectNama.disabled = false;
        dbSiswa[kelas].forEach(s => selectNama.add(new Option(s.nama, s.nis)));
      } else {
        selectNama.disabled = true;
        document.getElementById('btn-mulai').disabled = true;
      }
    }

    document.getElementById('nama').addEventListener('change', function() {
      document.getElementById('btn-mulai').disabled = this.value === "";
    });

    function mulaiUjian() {
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('exam-page').classList.remove('hidden');
      let sel = document.getElementById('nama');
      document.getElementById('nama-siswa-display').innerText = "Peserta: " + sel.options[sel.selectedIndex].text;
      
      document.documentElement.requestFullscreen().catch(() => {});
      tampilSoal();
    }


    // --- TAMPILKAN SOAL BERDASARKAN JENISNYA ---
    function tampilSoal() {
      let soal = dbSoal[indexSoal];
      
      let teksWacana = dbWacana[soal.id_wacana];
      document.getElementById('wacana-teks').innerHTML = teksWacana ? teksWacana.replace(/\n/g, "<br><br>") : "<span class='text-gray-400 italic'>Tidak ada teks referensi tambahan.</span>";

      let htmlSoal = `<p class="font-bold text-lg mb-4 text-justify">${indexSoal + 1}. ${soal.pertanyaan}</p>`;
      
      // 1. Pilihan Ganda Biasa
      if (soal.jenis === 'PG_Biasa') {
        soal.opsi.forEach((opsiTeks, idx) => {
          if(opsiTeks) {
            let val = (idx + 1).toString();
            let checked = jawabanSiswa[soal.id_soal] === val ? "checked" : "";
            htmlSoal += `
            <label class="block p-3 border border-gray-300 rounded-lg mb-2 hover:bg-blue-50 cursor-pointer transition">
              <input type="radio" name="soal_pg" value="${val}" ${checked} onchange="jawabanSiswa['${soal.id_soal}'] = this.value" class="mr-2"> 
              ${opsiTeks}
            </label>`;
          }
        });
      } 
      // 2. Pilihan Ganda Kompleks
      else if (soal.jenis === 'PG_Kompleks') {
        if (!jawabanSiswa[soal.id_soal]) jawabanSiswa[soal.id_soal] = []; 
        htmlSoal += `<p class="text-sm text-blue-600 mb-2 italic">*Pilih semua jawaban yang benar</p>`;
        
        soal.opsi.forEach((opsiTeks, idx) => {
          if(opsiTeks) {
            let val = (idx + 1).toString();
            let checked = jawabanSiswa[soal.id_soal].includes(val) ? "checked" : "";
            htmlSoal += `
            <label class="block p-3 border border-gray-300 rounded-lg mb-2 hover:bg-blue-50 cursor-pointer transition">
              <input type="checkbox" value="${val}" ${checked} onchange="updateKompleks('${soal.id_soal}', this.value, this.checked)" class="mr-2"> 
              ${opsiTeks}
            </label>`;
          }
        });
      }
      // 3. Benar / Salah
      else if (soal.jenis === 'Benar_Salah') {
        if (!jawabanSiswa[soal.id_soal]) jawabanSiswa[soal.id_soal] = []; 
        
        let tabel = `
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse border border-gray-300 mt-2">
            <tr class="bg-gray-100">
              <th class="border border-gray-300 p-3">Pernyataan</th>
              <th class="border border-gray-300 p-3 text-center w-20">Benar</th>
              <th class="border border-gray-300 p-3 text-center w-20">Salah</th>
            </tr>`;
            
        soal.opsi.forEach((opsiTeks, idx) => {
          if(opsiTeks) {
             let valB = jawabanSiswa[soal.id_soal][idx] === 'B' ? 'checked' : '';
             let valS = jawabanSiswa[soal.id_soal][idx] === 'S' ? 'checked' : '';
             tabel += `
             <tr class="hover:bg-gray-50">
               <td class="border border-gray-300 p-3 text-sm">${opsiTeks}</td>
               <td class="border border-gray-300 p-3 text-center bg-green-50"><input type="radio" name="bs_${soal.id_soal}_${idx}" value="B" ${valB} onchange="updateArray('${soal.id_soal}', ${idx}, 'B')" class="w-4 h-4 cursor-pointer"></td>
               <td class="border border-gray-300 p-3 text-center bg-red-50"><input type="radio" name="bs_${soal.id_soal}_${idx}" value="S" ${valS} onchange="updateArray('${soal.id_soal}', ${idx}, 'S')" class="w-4 h-4 cursor-pointer"></td>
             </tr>`;
          }
        });
        tabel += `</table></div>`;
        htmlSoal += tabel;
      }
      // 4. FITUR BARU: Menjodohkan
      else if (soal.jenis === 'Menjodohkan') {
        if (!jawabanSiswa[soal.id_soal]) jawabanSiswa[soal.id_soal] = []; 
        
        let tabel = `
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse border border-gray-300 mt-2">
            <tr class="bg-gray-100">
              <th class="border border-gray-300 p-3">Pernyataan / Tindakan</th>
              <th class="border border-gray-300 p-3 text-center w-32">Pasangan</th>
            </tr>`;
            
        soal.opsi.forEach((opsiTeks, idx) => {
          if(opsiTeks) {
             let jwb = jawabanSiswa[soal.id_soal][idx] || "";
             tabel += `
             <tr class="hover:bg-gray-50">
               <td class="border border-gray-300 p-3 text-sm">${opsiTeks}</td>
               <td class="border border-gray-300 p-2 text-center bg-blue-50">
                 <select class="w-full border border-gray-400 p-1 rounded font-bold text-center cursor-pointer" onchange="updateArray('${soal.id_soal}', ${idx}, this.value)">
                   <option value="">- Pilih -</option>
                   <option value="A" ${jwb === 'A' ? 'selected' : ''}>A</option>
                   <option value="B" ${jwb === 'B' ? 'selected' : ''}>B</option>
                   <option value="C" ${jwb === 'C' ? 'selected' : ''}>C</option>
                   <option value="D" ${jwb === 'D' ? 'selected' : ''}>D</option>
                   <option value="E" ${jwb === 'E' ? 'selected' : ''}>E</option>
                 </select>
               </td>
             </tr>`;
          }
        });
        tabel += `</table></div>`;
        htmlSoal += tabel;
      }

      document.getElementById('soal-container').innerHTML = htmlSoal;

      let btnNext = document.getElementById('btn-selanjutnya');
      if (indexSoal === dbSoal.length - 1) {
        btnNext.innerText = "SELESAI & KIRIM";
        btnNext.classList.replace('bg-blue-600', 'bg-red-600');
        btnNext.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
        btnNext.onclick = selesaiUjian;
      } else {
        btnNext.innerText = "SELANJUTNYA";
        btnNext.classList.replace('bg-red-600', 'bg-blue-600');
        btnNext.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
        btnNext.onclick = () => navigasi(1);
      }
    }

    // --- FUNGSI PEMBANTU INPUT ---
    function updateKompleks(id, nilai, isChecked) {
      if (isChecked) {
        jawabanSiswa[id].push(nilai);
        jawabanSiswa[id].sort();
      } else {
        jawabanSiswa[id] = jawabanSiswa[id].filter(item => item !== nilai);
      }
    }

    // Fungsi ini dipakai bersama untuk soal B/S dan Menjodohkan
    function updateArray(id, index, nilai) {
      jawabanSiswa[id][index] = nilai;
    }

    function navigasi(arah) {
      indexSoal += arah;
      if (indexSoal < 0) indexSoal = 0;
      tampilSoal();
    }


    // --- SUBMIT JAWABAN ---
    function selesaiUjian() {
      if (confirm("Apakah Anda yakin ingin mengumpulkan jawaban?")) {
        prosesSelesai();
      }
    }

    async function prosesSelesai() {
      // 1. Tampilkan Animasi Loading
      document.getElementById('exam-page').innerHTML = `
        <div class="flex flex-col items-center justify-center h-64 w-full">
          <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-600 mb-4"></div>
          <h2 class='text-xl font-bold text-gray-700'>Sedang memeriksa jawaban & menyimpan data...</h2>
          <p class="text-gray-500 mt-2">Mohon tunggu sebentar, maksimal 10 detik.</p>
        </div>`;
      
      // 2. Rapikan format jawaban
      let jawabanFinal = {};
      for (let id in jawabanSiswa) {
        if (Array.isArray(jawabanSiswa[id])) {
          jawabanFinal[id] = jawabanSiswa[id].map(v => v ? v : "").join(",");
        } else {
          jawabanFinal[id] = jawabanSiswa[id];
        }
      }

      const payload = {
        kelas: document.getElementById('kelas').value,
        nis: document.getElementById('nama').value,
        nama: document.getElementById('nama-siswa-display').innerText.replace("Peserta: ", ""),
        jawaban: jawabanFinal
      };

      try {
        // 3. FETCH DENGAN ATURAN ANTI-CORS GOOGLE
        const response = await fetch(API_URL, {
          method: "POST",
          redirect: "follow", // WAJIB: Ikuti pengalihan (redirect) dari server Google
          headers: {
            "Content-Type": "text/plain;charset=utf-8" // WAJIB: Gunakan text/plain untuk bypass preflight
          },
          body: JSON.stringify(payload)
        });
        
        // 4. Baca balasan sebagai teks terlebih dahulu (menghindari error jika Google mengembalikan HTML)
        const textResponse = await response.text();
        const resData = JSON.parse(textResponse);
        
        if (resData.status === "success") {
          let nilai = parseFloat(resData.skor);
          let kategori = ""; let warna = "";

          if (nilai >= 95.00) { kategori = "🌟 Istimewa"; warna = "text-green-600"; } 
          else if (nilai >= 76.67) { kategori = "Baik"; warna = "text-blue-500"; } 
          else if (nilai >= 50.00) { kategori = "Memadai"; warna = "text-yellow-600"; } 
          else { kategori = "⚠️ Kurang"; warna = "text-red-600"; }

          if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

          document.getElementById('exam-page').innerHTML = `
            <div class="text-center mt-10 w-full">
              <h2 class='text-3xl font-bold text-gray-800 mb-2'>Ujian Selesai!</h2>
              <div class="mt-8 p-8 bg-white border border-gray-200 rounded-2xl shadow-xl inline-block min-w-[320px]">
                <p class="text-gray-500 font-bold uppercase mb-2">Nilai Akhir Anda</p>
                <p class="text-7xl font-black ${warna}">${nilai}</p>
                <div class="mt-6 inline-block px-6 py-2 bg-gray-100 rounded-full border border-gray-200">
                  <p class="text-xl font-bold ${warna}">${kategori}</p>
                </div>
              </div>
              <p class="text-gray-600 mt-8 font-medium">Data nilai Anda telah terekam di sistem sekolah.</p>
            </div>`;
        } else {
          throw new Error("Gagal membaca status success dari server.");
        }
      } catch (error) {
        console.error("Error Detail:", error); // Menampilkan pesan asli di console untuk kemudahan perbaikan
        document.getElementById('exam-page').innerHTML = `
          <div class="text-center mt-20">
            <h2 class='text-2xl font-bold text-red-600 mb-4'>Koneksi Terputus / Gangguan Server</h2>
            <p class="text-gray-600 mb-6">Gagal terhubung ke database. Jawaban Anda mungkin belum tersimpan.</p>
            <button onclick="prosesSelesai()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded shadow">Coba Kirim Ulang</button>
          </div>`;
      }
    }
  </script>
</body>
</html>
